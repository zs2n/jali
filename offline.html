<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E4B39">
<title>جَلِيّ · لا يوجد اتصال</title>
<link rel="icon" href="./icons/favicon-32.png">
<script>try{if(localStorage.getItem('jali-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<style>
:root{--bg:#071A14;--surface:#0C241B;--ink:#F2EBDD;--muted:#B4BCAD;--line:#1F4434;--green:#0A7354;--brass:#D4B77A;color-scheme:dark}
:root[data-theme="light"]{--bg:#F6F2E9;--surface:#FFFDF8;--ink:#10241C;--muted:#4F5F56;--line:#D9D1BF;--green:#0A7354;--brass:#8A6420;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;line-height:1.8;padding:24px 16px}
.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--brass) 35%,transparent);border-radius:16px;box-shadow:0 18px 40px -18px rgb(0 0 0 / .6);padding:28px 24px;max-width:420px;width:100%;display:grid;gap:14px;text-align:center;justify-items:center}
img{width:72px;height:72px;border-radius:16px;box-shadow:0 0 0 1px color-mix(in srgb,var(--brass) 45%,transparent)}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
h1{margin:0;font-size:1.4rem}
p{margin:0;color:var(--muted)}
button{font:inherit;font-weight:600;min-height:46px;background:var(--green);color:#F2EBDD;border:0;border-radius:10px;padding:10px 22px;cursor:pointer;box-shadow:inset 0 0 0 1px color-mix(in srgb,#D4B77A 30%,transparent)}
</style>
</head>
<body>
  <main class="card">
    <img src="./icons/icon-192.png" alt="">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>لم تُحفظ هذه الصفحة على جهازك بعد. افتح جَلِيّ مرة واحدة وأنت متصل، وستتمكن بعدها من فتح الصفحات الرئيسية دون اتصال.</p>
    <button type="button" onclick="location.reload()">أعد المحاولة</button>
  </main>
</body>
</html>
